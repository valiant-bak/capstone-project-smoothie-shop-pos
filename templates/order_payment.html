{% extends 'base.html' %}

{% block title %}🔒 Secure PayPal Terminal | Oasis{% endblock %}

{% block content %}
<!-- FontAwesome CDN directly for clean visual icons -->
<link rel="stylesheet" href="https://cloudflare.com">

<!-- WARNING: Include the official PayPal JavaScript SDK -->
<!-- Using 'client-id=test' loads PayPal's built-in sandbox mock testing window instantly -->
<script src="https://www.paypal.com/sdk/js?client-id=test&currency=USD"></script>

<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow border-0 p-4">
            
            <div class="text-center">
                <div class="text-primary mb-2" style="font-size: 54px;">
                    <i class="fab fa-paypal"></i>
                </div>
                <h3 class="fw-bold mb-1">Oasis PayPal Portal</h3>
                <p class="text-muted small">Secure Staff Register Integration</p>
                <!-- Visual Countdown Badge for the Staff Member -->
                <div class="badge bg-warning text-dark my-2 p-2" style="font-size:1rem" id="timer-badge">
                    ⏱️Payment Confirmation in <span id="countdown">5</span> seconds...
                </div>
            </div>
            
            <hr>
            
            <div class="payment-summary my-3 bg-light p-3 rounded text-center">
                <span class="text-secondary small text-uppercase fw-bold d-block mb-1">Total Due From Customer</span>
                <h1 class="text-primary fw-extrabold m-0">${{ "%.2f"|format(grand_total) }}</h1>
            </div>

            <!-- This is where PayPal's engine dynamically drops the smart transaction buttons -->
            <div id="paypal-button-container" class="mt-4" style="min-height: 150px;"></div>
            
                <!-- The order is saved in the active session cart (Saved in the active session memory)-->
                <!-- Hidden form used to submit a clean POST command back to Flask upon successful authorization -->
                <form id="hidden-success-form" action="{{ url_for('process_payment', order_id=order_id) }}" method="POST" style="display: none;">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- =========================================================================
     PAYPAL SMART BUTTONS & AUTO-RELOAD CONTROLLER ENGINE
     ========================================================================= -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        
        // 1. COUNTDOWN & AUTO-RELOAD ENGINE
        let secondsLeft = 5;
        const countdownElement = document.getElementById('countdown');

        const countdownInterval = setInterval(function() {
            secondsLeft--;
            if (countdownElement) {
                countdownElement.textContent = secondsLeft;
            }
            
            if (secondsLeft <= 0) {
                clearInterval(countdownInterval);
                
                //  REPLACE window.location.href WITH THIS:
                document.getElementById('hidden-success-form').submit();
            }
        }, 1000); // Fires exactly once every 1000ms (1 second)

        // 2. OFFICIAL PAYPAL INTERFACE ENGINE
        paypal.Buttons({
            createOrder: function(data, actions) {
                // If they click the button, stop the background timer so it doesn't interrupt their checkout!
                clearInterval(countdownInterval);
                document.getElementById('timer-badge').style.display = 'none';

                return actions.order.create({
                    purchase_units: [{
                        amount: {
                            value: '{{ "%.2f"|format(grand_total) }}'
                        }
                    }]
                });
            },

            onApprove: function(data, actions) {
                return actions.order.capture().then(function(details) {
                    alert('Transaction approved securely by ' + details.payer.name.given_name + '!');
                    document.getElementById('hidden-success-form').submit();
                });
            },

            onCancel: function(data) {
                alert('Payment window cancelled. Order ticket held as pending.');
                // Restart page state if canceled
                window.location.reload();
            },

            onError: function(err) {
                console.error('PayPal Runtime Error:', err);
                alert('An error occurred communicating with the payment gateway networks.');
            }
        }).render('#paypal-button-container');
    });
</script>
{% endblock %}
